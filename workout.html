<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fitness Buddy – Workout Tracker</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">💪 Fitness Buddy</div>
    <ul class="nav-links">
      <li><a href="index.html">Dashboard</a></li>
      <li><a href="workout.html" class="active">Workouts</a></li>
      <li><a href="calories.html">Calories</a></li>
    </ul>
  </nav>

  <main class="container">
    <header class="page-header">
      <h1>Workout Tracker</h1>
      <p class="subtitle">Log and track your exercise sessions.</p>
    </header>

    <!-- Log Workout Form -->
    <section class="section">
      <h2 class="section-title">Log a Workout</h2>
      <form class="card form-card" id="workout-form">
        <div class="form-row">
          <div class="form-group">
            <label for="workout-name">Exercise Name</label>
            <input type="text" id="workout-name" placeholder="e.g. Push-ups" required />
          </div>
          <div class="form-group">
            <label for="workout-category">Category</label>
            <select id="workout-category">
              <option value="Strength">Strength</option>
              <option value="Cardio">Cardio</option>
              <option value="Flexibility">Flexibility</option>
              <option value="HIIT">HIIT</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="workout-sets">Sets</label>
            <input type="number" id="workout-sets" placeholder="e.g. 3" min="1" />
          </div>
          <div class="form-group">
            <label for="workout-reps">Reps</label>
            <input type="number" id="workout-reps" placeholder="e.g. 12" min="1" />
          </div>
          <div class="form-group">
            <label for="workout-duration">Duration (min)</label>
            <input type="number" id="workout-duration" placeholder="e.g. 30" min="1" />
          </div>
          <div class="form-group">
            <label for="workout-calories">Calories Burned</label>
            <input type="number" id="workout-calories" placeholder="e.g. 200" min="0" />
          </div>
        </div>
        <div class="form-group">
          <label for="workout-notes">Notes (optional)</label>
          <textarea id="workout-notes" placeholder="Any additional notes..."></textarea>
        </div>
        <button type="submit" class="btn btn--primary">Add Workout</button>
      </form>
    </section>

    <!-- Today's Workouts -->
    <section class="section">
      <div class="section-header">
        <h2 class="section-title">Today's Workouts</h2>
        <span class="badge" id="workout-count">0 logged</span>
      </div>
      <div id="workout-list">
        <p class="empty-state">No workouts logged today. Add your first one above!</p>
      </div>
    </section>

    <!-- Workout History -->
    <section class="section">
      <h2 class="section-title">Workout History</h2>
      <div id="workout-history">
        <p class="empty-state">No history yet.</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>Fitness Buddy &copy; 2026 — Built for internship project</p>
  </footer>

  <script src="js/workout.js"></script>
</body>
</html>
